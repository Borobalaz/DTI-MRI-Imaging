; Theme-independent layout metrics (margins/spacing/sizes) - the same value for both themes,
; so they live here once instead of being duplicated into dark.ini and light.ini.
;
; Referenced two ways:
;  - From ui/styles/widgets/**/*.qss as @token-name, same as a color token.
;  - From C++ via ResolveCommonToken("token-name") for values a QSS selector can't reach
;    (an external QLayout's margins/spacing, a fixed widget width) - see
;    SceneObjectListWidget.cpp, InspectorWidget.cpp, RenderStatisticsWidget.cpp,
;    InspectProviderWidget.cpp for the call sites.

panel-margin=0
panel-spacing=8

object-list-min-width=220
inspector-min-width=260
stats-min-width=220

stats-margin=12
stats-spacing-h=12
stats-spacing-v=6

field-row-margin-h=4
field-row-margin-v=6
field-row-spacing=8
field-label-width=104

provider-item-min-height=30
provider-item-margin-h=8
provider-item-margin-v=4
provider-item-spacing=8
